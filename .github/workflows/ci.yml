name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  # 新增遷移就必須同步更新架構文件。這道關卡是有前科才加的:0015 / 0016 / 0017
  # 三支遷移都在沒動 docs/architecture.md 的情況下進版,於是「規格權威來源」少了
  # 三張實際存在的資料表,還留著一張從未實作的 `school`。靠人記得已經證明無效。
  # 真的與架構無關時,在 commit 訊息寫 [no-arch] 放行。
  docs-sync:
    name: 文件同步檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 比對遷移與架構文件
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # 取得本次改動的檔案清單(PR 比對基底分支;push 比對前一次提交)
          if [ -n "${BASE_SHA:-}" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            RANGE="$BASE_SHA...HEAD"
          else
            RANGE="HEAD~1...HEAD"   # 首次推送等取不到基底時,退回看最後一顆
          fi
          echo "比對範圍:$RANGE"
          CHANGED=$(git diff --name-only "$RANGE")
          NEW_MIGRATIONS=$(git diff --name-only --diff-filter=A "$RANGE" \
            | grep '^backend/alembic/versions/' || true)

          if [ -z "$NEW_MIGRATIONS" ]; then
            echo "本次未新增遷移,略過。"; exit 0
          fi
          echo "新增的遷移:"; echo "$NEW_MIGRATIONS" | sed 's/^/  /'

          if git log --format=%B "$RANGE" | grep -qF '[no-arch]'; then
            echo "commit 訊息含 [no-arch],放行。"; exit 0
          fi
          if echo "$CHANGED" | grep -q '^docs/architecture.md$'; then
            echo "docs/architecture.md 已同步更新 ✓"; exit 0
          fi

          echo "::error::新增了資料庫遷移,但沒有更新 docs/architecture.md。"
          echo "docs/architecture.md 是本專案的規格權威來源:schema 變更(新表、"
          echo "新欄位、新約束)必須反映在 §2 核心實體定義,否則後人照著文件理解"
          echo "資料庫就會錯。請補上說明後再推;若這支遷移純技術性、與架構無關,"
          echo "在 commit 訊息加上 [no-arch] 即可放行。"
          exit 1

      # docs/ 下每份 .md 都有一份給離線閱讀的 .html,由 scripts/build_docs.py 產生。
      # 只改 .md 而忘了重新產生,讀者手上的 HTML 就是舊的——那比沒有還糟。
      # markdown 版本釘住,否則套件升版時輸出微幅變動會讓這道檢查無故轉紅。
      - name: 文件 HTML 與 Markdown 同步檢查
        run: |
          pip install --quiet "markdown==3.10.2"
          python scripts/build_docs.py --check

  backend:
    name: 後端 lint / type / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安裝相依
        run: pip install -e ".[dev]"
      - name: Ruff(格式與規則)
        run: ruff check .
      - name: Mypy(型別檢查)
        run: mypy app
      - name: Pytest(單元測試)
        run: python -m pytest -q

  # 第三方套件弱點檢查(v1.5.0):正式映像裝的 Python 相依(含匯出 PDF 用的 export)
  # 有已知弱點就擋下。數發部的第三方元件掃描只涵蓋前端,後端由這裡把關。
  backend-audit:
    name: Python 套件弱點檢查(pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝正式映像的相依
        # 先升級 pip:基底映像內建的 pip 版本較舊(正式映像建置時一樣會先升級)
        run: python -m pip install --upgrade pip && pip install -e ".[export]" pip-audit
      - name: pip-audit
        run: pip-audit --skip-editable --desc on --progress-spinner off

  frontend:
    name: 前端 lint / build / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安裝相依(依 lock 檔完全重現)
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: 建置(含 vue-tsc 型別檢查)
        run: npm run build
      - name: Vitest(單元測試)
        run: npm run test
      # 第三方套件弱點檢查(v1.5.0):中風險以上就擋下(含建置與測試用的開發相依)
      - name: npm 套件弱點檢查(npm audit)
        run: npm audit --audit-level=moderate

  migrations:
    name: 資料庫遷移驗證(PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安裝相依
        run: pip install -e ".[dev]"
      # 測試用的臨時資料庫:密碼在執行時才產生(v1.6.0,不寫在 workflow 檔裡)。
      # 以 TCP 檢查就緒:初始化期間的暫時伺服器只聽 unix socket,TCP 通了才是正式啟動。
      - name: 啟動臨時 PostgreSQL
        run: |
          db_secret=$(openssl rand -hex 16)
          echo "::add-mask::$db_secret"
          echo "DB_SECRET=$db_secret" >> "$GITHUB_ENV"
          docker run -d --name ci-postgres -p 5432:5432 \
            -e POSTGRES_USER=scheduler -e POSTGRES_DB=scheduler -e POSTGRES_PASSWORD="$db_secret" \
            postgres:16-alpine
          for i in $(seq 1 60); do
            docker exec ci-postgres pg_isready -h 127.0.0.1 -U scheduler && exit 0
            sleep 2
          done
          docker logs ci-postgres
          exit 1
      - name: 對全新 PostgreSQL 執行 alembic upgrade head
        run: POSTGRES_HOST=localhost POSTGRES_PASSWORD="$DB_SECRET" alembic upgrade head

  e2e:
    name: E2E 驗收(Playwright 對 Docker 全棧)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # 在 runner 上以 buildx 建三個映像(不推送,load 進本機 daemon)。
      # 不拉 :main 現成映像的原因:PR 必須驗 PR 自己的程式碼;
      # 快取 scope 與 images job 共用,main 建過之後 PR 的建置只剩分鐘級。
      - name: 建置 api 映像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: base
          load: true
          tags: ghcr.io/begin0808/course_scheduling_system-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: 建置 worker 映像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: worker
          load: true
          tags: ghcr.io/begin0808/course_scheduling_system-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: 建置 web 映像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          load: true
          tags: ghcr.io/begin0808/course_scheduling_system-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: 準備 .env 並啟動全棧
        run: |
          # 密碼與金鑰每次執行隨機產生;不設 DATABASE_URL,走「由 POSTGRES_* 組連線」的路徑(v1.5.0)
          cat > .env <<EOF
          ADMIN_USERNAME=admin
          ADMIN_PASSWORD=$(openssl rand -hex 16)
          SCHOOL_NAME=CI 測試學校
          TZ=Asia/Taipei
          SECRET_KEY=$(openssl rand -hex 32)
          HTTP_PORT=80
          IMAGE_TAG=ci
          POSTGRES_USER=scheduler
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_DB=scheduler
          REDIS_URL=redis://redis:6379/0
          EOF
          docker compose up -d --no-build --wait --wait-timeout 180
      - name: 建立 E2E 帳號與精靈狀態
        run: docker compose exec -T api python - < backend/tests/seed_e2e.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安裝前端相依與 Playwright 瀏覽器
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 執行 E2E 迴歸套件(chromium project)
        working-directory: frontend
        run: npm run e2e
      - name: 失敗時收集容器紀錄
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt || true
      - name: 上傳診斷產物(報告 / trace / 失敗截圖 / 容器紀錄)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
            compose-logs.txt
          retention-days: 7
          if-no-files-found: ignore

  images:
    name: 建置並發布映像
    runs-on: ubuntu-latest
    # e2e 為前置:E2E 紅燈時不得發布映像
    needs: [backend, backend-audit, frontend, migrations, e2e]
    # main push:僅 amd64(快速);版本標籤 v*:amd64+arm64 雙架構(正式發布)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 計算映像名稱(需小寫)
        run: echo "IMAGE_BASE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: 決定建置架構與 channel 標籤
        id: platforms
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "value=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.ref_name }}" == *-* ]]; then
              # 預發布(如 v1.0.0-rc1):建雙架構供演練,但 channel 用自身標籤,不動 :latest
              echo "channel=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            else
              # 正式版才更新 :latest;main push 僅單架構,不可覆蓋 :latest
              # 否則 ARM 用戶(IMAGE_TAG=latest)pull 到只有 amd64 的 manifest 會起不來
              echo "channel=latest" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "value=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "channel=main" >> "$GITHUB_OUTPUT"
          fi
          # 注入映像的系統版本:版本標籤即版號(v1.2.3);main 為 main-<短 sha>(不參與新版比較)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "app_version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "app_version=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 登入 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 建置並推送 api 映像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: base
          platforms: ${{ steps.platforms.outputs.value }}
          build-args: APP_VERSION=${{ steps.platforms.outputs.app_version }}
          push: true
          # ref_name:main push 為 "main";版本標籤推送則為 "v1.0.0"(供 .env 的 IMAGE_TAG 釘選)
          tags: |
            ${{ env.IMAGE_BASE }}-api:${{ steps.platforms.outputs.channel }}
            ${{ env.IMAGE_BASE }}-api:${{ github.ref_name }}
            ${{ env.IMAGE_BASE }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: 建置並推送 worker 映像(含 PDF/字型依賴)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: worker
          platforms: ${{ steps.platforms.outputs.value }}
          build-args: APP_VERSION=${{ steps.platforms.outputs.app_version }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-worker:${{ steps.platforms.outputs.channel }}
            ${{ env.IMAGE_BASE }}-worker:${{ github.ref_name }}
            ${{ env.IMAGE_BASE }}-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: 建置並推送 web 映像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-web:${{ steps.platforms.outputs.channel }}
            ${{ env.IMAGE_BASE }}-web:${{ github.ref_name }}
            ${{ env.IMAGE_BASE }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
